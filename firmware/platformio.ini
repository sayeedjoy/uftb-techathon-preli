; One firmware, three zone nodes.
;
; The zone's UUID and API key are compiled in, so each zone needs its own
; binary — that is what lets all three run at the same time instead of one at
; a time. `pnpm firmware:config -- --all` generates the per-zone headers that
; ZONE_SECRETS_HEADER points at; they are gitignored because they hold live
; credentials.
;
;   pio run                       # all three zones
;   pio run -e server-room        # just one
;
; Binaries land in .pio/build/<zone>/firmware.elf, which is what lets three
; Wokwi sessions run in parallel against three different diagrams.

[platformio]
; multi-room is included on purpose: wokwi.toml points the VS Code extension at
; its binary, so leaving it out of the default build makes "Start Simulator"
; fail with "firmware.bin not found" on a fresh checkout.
default_envs = iot-lab, robotics-lab, server-room, multi-room

[common]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINOJSON_DECODE_UNICODE=1

[env:iot-lab]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D ZONE_SECRETS_HEADER=\"zones/iot-lab.h\"

[env:robotics-lab]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D ZONE_SECRETS_HEADER=\"zones/robotics-lab.h\"

[env:server-room]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D ZONE_SECRETS_HEADER=\"zones/server-room.h\"

; One board that can be any room. Wokwi simulates a single microcontroller per
; project, so three nodes cannot share a diagram — this build carries every
; zone's credentials and sensor set and switches between them on a button.
;   pnpm firmware:config -- --registry
;   pio run -e multi-room
;   wokwi-cli . --elf .pio/build/multi-room/firmware.elf \
;               --diagram-file zones/multi/diagram.json
[env:multi-room]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D MULTI_ZONE_NODE
